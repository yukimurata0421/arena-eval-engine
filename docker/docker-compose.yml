services:
  arena-tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
    command: ["python", "-m", "pytest", "-q", "-m", "not real_data"]
  arena-validate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command:
      [
        "python",
        "-m",
        "arena.cli",
        "validate",
      ]
  arena-run-stage1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command:
      [
        "python",
        "-m",
        "arena.cli",
        "run",
        "--backend",
        "native",
        "--data-dir",
        "/workspace/data",
        "--output-dir",
        "/workspace/output",
        "--stage",
        "1",
        "--no-gpu",
      ]
  arena-real-stage1:
    profiles: ["real"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
    working_dir: /workspace
    environment:
      OPENSKY_CREDENTIALS_JSON: /run/secrets/opensky_credentials.json
    volumes:
      - ..:/workspace
      - ${ARENA_REAL_DATA_ROOT:-../data}:/workspace/real-data
      - ${ARENA_REAL_OUTPUT_ROOT:-../output}:/workspace/real-output
      - ${ARENA_REAL_SETTINGS_PATH:-../scripts/config/settings.toml}:/workspace/real-settings/settings.toml:ro
      - ${ARENA_REAL_PHASE_CONFIG_PATH:-../scripts/config/phases.txt}:/workspace/real-settings/phases.txt:ro
      - ${ARENA_OPENSKY_CREDENTIALS_PATH:-../scripts/secrets/opensky_credentials.json}:/run/secrets/opensky_credentials.json:ro
    command:
      [
        "python",
        "-m",
        "arena.cli",
        "run",
        "--backend",
        "native",
        "--only",
        "1",
        "--no-gpu",
        "--data-dir",
        "/workspace/real-data",
        "--output-dir",
        "/workspace/real-output",
        "--settings",
        "/workspace/real-settings/settings.toml",
        "--phase-config",
        "/workspace/real-settings/phases.txt",
      ]
  arena-real-full:
    profiles: ["real"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
    working_dir: /workspace
    environment:
      OPENSKY_CREDENTIALS_JSON: /run/secrets/opensky_credentials.json
    volumes:
      - ..:/workspace
      - ${ARENA_REAL_DATA_ROOT:-../data}:/workspace/real-data
      - ${ARENA_REAL_OUTPUT_ROOT:-../output}:/workspace/real-output
      - ${ARENA_REAL_SETTINGS_PATH:-../scripts/config/settings.toml}:/workspace/real-settings/settings.toml:ro
      - ${ARENA_REAL_PHASE_CONFIG_PATH:-../scripts/config/phases.txt}:/workspace/real-settings/phases.txt:ro
      - ${ARENA_OPENSKY_CREDENTIALS_PATH:-../scripts/secrets/opensky_credentials.json}:/run/secrets/opensky_credentials.json:ro
    command:
      [
        "python",
        "-m",
        "arena.cli",
        "run",
        "--backend",
        "native",
        "--no-gpu",
        "--data-dir",
        "/workspace/real-data",
        "--output-dir",
        "/workspace/real-output",
        "--settings",
        "/workspace/real-settings/settings.toml",
        "--phase-config",
        "/workspace/real-settings/phases.txt",
      ]
