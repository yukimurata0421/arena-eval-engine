name: ci

on:
  push:
  pull_request:

env:
  COVERAGE_FAIL_UNDER: "86"

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests scripts/tools/artifacts

  tests:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Pytest
        run: python -m pytest -q -m "not real_data" --cov-fail-under=${{ env.COVERAGE_FAIL_UNDER }}

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Tool versions
        run: |
          python -m pytest --version
          python - <<'PY'
          import coverage
          import pytest
          import pytest_cov
          print("pytest", pytest.__version__)
          print("pytest-cov", pytest_cov.__version__)
          print("coverage", coverage.__version__)
          PY
      - name: Coverage
        run: |
          python -m pytest -q -m "not real_data" --cov-fail-under=${{ env.COVERAGE_FAIL_UNDER }}
          if ls .coverage.* >/dev/null 2>&1; then
            coverage combine
          fi
          coverage report --rcfile=.coveragerc --fail-under=${{ env.COVERAGE_FAIL_UNDER }} -m
          coverage xml --rcfile=.coveragerc
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  compatibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install ".[dev]"
      - name: Non-editable CLI path compatibility
        working-directory: tests
        run: >
          python -m arena.cli validate
          --scripts-root ../scripts
          --data-dir ../data
          --output-dir ../output
          --settings ../scripts/config/settings.toml
          --phase-config ../scripts/config/phases.txt
          --create-dirs
      - name: Legacy wrapper help
        run: python scripts/tools/merge_output_for_ai/merge_output_for_ai.py --help
      - name: Artifacts CLI help
        run: python scripts/tools/artifacts/cli.py --help
      - name: Compatibility regression tests
        run: |
          python -m pytest -q --no-cov tests/test_cli.py tests/test_entrypoint_orchestration.py tests/test_artifacts_migration.py
      - name: Artifact CLI entrypoint smoke
        run: python -m arena.artifact_cli --help
      - name: Synthesis sample smoke
        run: |
          python -m arena.cli synthesis run \
            --path sample_data/synthesis/raw \
            --db "${RUNNER_TEMP}/synthesis-smoke/synthesis.sqlite3" \
            --enriched-dir "${RUNNER_TEMP}/synthesis-smoke/enriched" \
            --review-dir "${RUNNER_TEMP}/synthesis-smoke/review" \
            --raw-original-dir "${RUNNER_TEMP}/synthesis-smoke/raw_original" \
            --raw-repaired-dir "${RUNNER_TEMP}/synthesis-smoke/raw_repaired" \
            --repair-log-dir "${RUNNER_TEMP}/synthesis-smoke/repair_logs"
