[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-eval-engine"
version = "0.2.8"
requires-python = ">=3.11"
description = "Statistical evaluation engine for ADS-B receiver performance"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "folium>=0.16",
  "requests>=2.31",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
]

[project.scripts]
arena = "arena.cli:main"
artifact = "arena.artifact_cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["arena*"]

# ── Ruff ──────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 140
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "UP",     # pyupgrade (modernise syntax)
  "B",      # flake8-bugbear
  "SIM",    # flake8-simplify
  "RUF",    # ruff-specific rules
]
ignore = [
  "E402",   # module-level import not at top (sys.path manipulation)
  "E501",   # line too long — handled by formatter
  "SIM108", # ternary operator — readability preference
  "RUF001", # ambiguous unicode — intentional (fullwidth Japanese characters)
  "RUF002", # ambiguous unicode in docstrings
  "RUF003", # ambiguous unicode in comments
]

[tool.ruff.lint.isort]
known-first-party = ["arena"]

# ── Pytest ────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

# ── Mypy ──────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
