[pytest]
testpaths = tests
norecursedirs = data output scripts .git .venv venv .venv
addopts = -q --tb=short --cov=src/arena --cov=scripts --cov-config=.coveragerc --cov-report=term
pythonpath = src .
markers =
    slow: long-running tests (run explicitly)
    gpu: tests requiring GPU/JAX (run explicitly)
    real_data: opt-in smoke tests against private local datasets
